name: Update cards.parquet

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run update_cards.py
        run: uv run python update_cards.py

      - name: Replace cards.parquet
        run: mv tmp/cards.parquet cards.parquet

      - name: Remove tmp/
        run: rm -rf tmp/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards.parquet
          git commit -m "chore: update cards.parquet"
          git push
